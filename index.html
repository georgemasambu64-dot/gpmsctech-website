
<script>
const DURATION = 24 * 60 * 60 * 1000;

let startTime = localStorage.getItem("gpmsc_start");

if (!startTime) {
    startTime = Date.now();
    localStorage.setItem("gpmsc_start", startTime);
}

function updateTimer() {
    const timer = document.getElementById("timer");
    const status = document.getElementById("status");

    const start = Number(startTime);
    const endTime = start + DURATION;
    const now = Date.now();
    const diff = endTime - now;

    if (diff <= 0) {
        timer.textContent = "TRIAL IMEISHA";
        timer.style.color = "#ff4444";
        status.innerHTML =
          "Lipa TZS 20,000 CRDB Lipa Namba 10055686<br>Huduma imefungwa!";
        return;
    }

    const hours = Math.floor(diff / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    timer.textContent =
        String(hours).padStart(2, "0") + "h " +
        String(minutes).padStart(2, "0") + "m " +
        String(seconds).padStart(2, "0") + "s";

    status.textContent =
        "Muda uliobaki kabla huduma haijafungwa";
}

updateTimer();

const interval = setInterval(() => {
    updateTimer();

    if (Date.now() >= Number(startTime) + DURATION) {
        clearInterval(interval);
    }
}, 1000);

function resetTimer() {
    localStorage.removeItem("gpmsc_start");
    location.reload();
}
</script>
